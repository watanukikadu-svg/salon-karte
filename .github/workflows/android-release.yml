# Android 版（Google Play に出すファイル .aab）を作る。
# GitHub の「Actions」タブ →「Android 版を作る」→「Run workflow」で動かす。
# できたファイルは、実行結果のページ下の「Artifacts」からダウンロードできる。
name: Android 版を作る

on:
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン（例: 1.0.0）"
        required: true
        default: "1.0.0"

permissions:
  contents: write # 初回だけ、署名用の鍵ファイルをリポジトリに保存するため

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE: android/upload-keystore.p12
    steps:
      - uses: actions/checkout@v4

      - name: 必要な設定がそろっているか確認
        run: |
          if [ ${#ANDROID_KEYSTORE_PASSWORD} -lt 8 ]; then
            echo "::error::GitHub の Secrets に ANDROID_KEYSTORE_PASSWORD（8文字以上）を入れてください"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: アプリの画面を作る
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: 署名用の鍵を用意する（初回だけ作って保存）
        run: |
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" -storetype PKCS12 \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" \
              -dname "CN=Salon Karte, O=STAYGOLD, C=JP"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE"
            git commit -m "Android の署名用の鍵を追加（パスワードは GitHub の Secrets にだけある）"
            git push
          fi

      - name: Android 版を作る
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version }}
        run: |
          export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/$KEYSTORE"
          cd android
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.version }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
