<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16343a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="美容室カルテ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>美容室カルテ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 美容室カルテ 本番版
   VOICE: calm, tidy, a tool a stylist trusts between cuts
   IDEA: the salon's appointment book and carte card, in a phone
   PICTURE: the working app itself — today's book with big hanging times
   COLOUR and TYPE: white ground, deep mirror-teal #16343a, hair-colour coral #e0566a; Zen Kaku Gothic New + Outfit numerals
   LAYOUT: one column, sticky header, bottom tab bar, sheets slide up for forms */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e1a1d);--card:light-dark(#f3f6f6,#16272b);--ink:light-dark(#122326,#e8f0f0);
--sub:light-dark(#5b6d70,#9db1b4);--line:light-dark(#dfe7e8,#26393d);--line2:light-dark(#bccacc,#3f585d);--deep:light-dark(#16343a,#0a1517);
--deepInk:#f2f7f7;--sel:light-dark(#16343a,#2c5961);--acc:#e0566a;--accSoft:light-dark(#fde8eb,#3a1f25);--ok:light-dark(#2f7d63,#6fcaa8)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
.num{font-family:Outfit,"Zen Kaku Gothic New",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
header{position:sticky;top:0;z-index:5;background:var(--deep);color:var(--deepInk);padding:calc(14px + env(safe-area-inset-top)) max(4vw,16px) 12px}
header h1{margin:0;font-size:22px;line-height:1.2;font-weight:700}
header p{margin:2px 0 0;font-size:13px;opacity:.75}
main{max-width:640px;margin:0 auto;padding:16px max(4vw,16px) 110px}
.demo{font-size:13px;color:var(--sub);margin:0 0 12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{min-height:60px;border:0;background:none;color:var(--sub);font:inherit;font-size:13px;display:grid;place-items:center;gap:2px;padding:8px 0;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected=true]{color:var(--acc);font-weight:700}
h2{font-size:20px;margin:18px 0 10px;line-height:1.2}
.x{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -4px;scrollbar-width:none}
.days button{flex:none;width:56px;min-height:64px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;display:grid;place-items:center;padding:6px 0;line-height:1.2}
.days button small{font-size:13px;color:var(--sub)}
.days button b{font:600 20px Outfit,sans-serif}
.days button[aria-pressed=true]{background:var(--sel);border-color:var(--sel);color:var(--deepInk)}
.days button[aria-pressed=true] small{color:var(--deepInk);opacity:.8}
.days button.has::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--acc)}
.cal{background:var(--card);border-radius:18px;padding:10px 10px 12px}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.calh b{font-size:17px}
.calh button{min-width:44px;min-height:44px;border:0;border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:20px;cursor:pointer}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.calg .w{font-size:13px;color:var(--sub);padding:2px 0}
.calg .w:first-child{color:var(--acc)}
.calg button{min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--ink);font:500 16px Outfit,sans-serif;cursor:pointer;display:grid;place-items:center;align-content:center;gap:2px;padding:0}
.calg button.past{color:var(--sub);opacity:.6}
.calg button.td{box-shadow:inset 0 0 0 2px var(--acc)}
.calg button[aria-pressed=true]{background:var(--sel);color:var(--deepInk)}
.calg button i{width:5px;height:5px;border-radius:50%;background:transparent}
.calg button.has i{background:var(--acc)}
.today{margin-top:8px;width:100%}
.pics{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pics button{padding:0;border:0;background:none;cursor:zoom-in;aspect-ratio:1;border-radius:10px;overflow:hidden}
.pics img{width:100%;height:100%;object-fit:cover;display:block}
.pv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.pv img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.hint{font-size:13px;color:var(--sub);margin:4px 0 0}
.lb{position:fixed;inset:0;z-index:30;background:rgb(0 0 0/.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:78vh;border-radius:12px}
.lb .row{justify-content:center}
.lb .btn{background:#fff;color:#122326;border-color:#fff}
.lb .cnt{color:#fff;font-size:14px}
.sorts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sorts button{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.sorts button[aria-pressed=true]{background:var(--sel);border-color:var(--sel);color:var(--deepInk);font-weight:700}
.list .last b{font-weight:700;color:var(--ink)}.list .last b.soon{color:var(--acc)}
.kana{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:2px 16px 6px;scroll-snap-type:x proximity;scroll-padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.kana::-webkit-scrollbar{display:none}
.kana[hidden]{display:none}
.kana button{flex:none;scroll-snap-align:start;min-width:48px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;font-weight:500;cursor:pointer}
.kana button:first-child{font-size:14px}
.kana button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.list li.gh{font-size:13px;font-weight:700;color:var(--sub);padding:12px 4px 2px;border-bottom:1px solid var(--line)}
.av{overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.big2{width:72px;height:72px;font-size:26px}
.face{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.facebtn{padding:0;border:0;background:none;border-radius:50%;cursor:zoom-in}
.facein{display:flex;gap:14px;align-items:center}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;margin-top:8px}.chk input{width:22px;min-height:22px;height:22px}
.warnt{color:var(--acc);font-weight:700}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;margin-top:8px}.mrow:first-child{margin-top:0}
.mx{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--sub);font-size:20px;cursor:pointer}.mx[hidden]{display:none}
.mrow:has(.mx[hidden]){grid-template-columns:minmax(0,1fr)}
.prw{display:grid;grid-template-columns:minmax(0,1fr) 64px 44px;gap:8px;margin-top:8px}.prw input{text-align:center;padding:8px 4px}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{margin:0;color:var(--ink);font-size:15px;cursor:pointer}
.mchip input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.mchip span{display:flex;flex-direction:column;justify-content:center;min-height:52px;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);line-height:1.3}
.mchip small{font-size:13px;color:var(--sub)}
.mchip input:checked+span{background:var(--deep);border-color:var(--deep);color:var(--deepInk)}
.mchip input:checked+span small{color:var(--deepInk);opacity:.8}
.mchip input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.pv.ed{margin:0 0 8px}.pk{position:relative}.pk img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.pk button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgb(0 0 0/.65);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.adm{list-style:none;padding:0;margin:0 0 12px}
.adm li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.adm small{color:var(--sub);font-size:13px}.adm small.low{color:var(--acc);font-weight:700}
.adm li.empty{display:block;border:0}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.prow small{color:var(--sub);font-size:13px}.prow input{text-align:center}
.book{list-style:none;margin:14px 0 0;padding:0}
.book li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:14px;margin-top:12px;border:1px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:0 1px 3px rgb(0 0 0/.05)}
.book li:has(.tag.done){background:var(--card)}
.book .bkrow{grid-column:1/-1;margin:0}
.book .t{font:600 22px/1.1 Outfit,sans-serif}
.book .t small{display:block;font-size:13px;color:var(--sub);font-weight:500;margin-top:4px}
.book .who{font-weight:700;font-size:17px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.av.sm{width:32px;height:32px;font-size:14px}
.book .menu{color:var(--sub);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.wide{width:100%}
.btn.danger{color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--card);color:var(--sub)}
.tag.done{background:transparent;color:var(--ok);border:1px solid currentColor}
.tag.warn{background:var(--accSoft);color:var(--acc);font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--sub);background:var(--card);border-radius:16px;margin-top:14px}
.search{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}
.list{list-style:none;padding:0;margin:10px 0 0}
.list li button{width:100%;text-align:start;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sel);color:var(--deepInk);font-weight:700}
.list .nm{font-weight:700}.list .kn{font-size:13px;color:var(--sub)}
.list .last{font-size:13px;color:var(--sub);text-align:end}
.carte{background:var(--card);border-radius:18px;padding:16px;margin-top:6px}
.carte dl{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:6px 10px;margin:10px 0 0;font-size:15px}
.carte dt{color:var(--sub)}.carte dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.visit{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;background:var(--bg);box-shadow:0 1px 3px rgb(0 0 0/.05);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.visit .d{font-weight:600}.visit b{font-size:17px}
.visit .d{font-size:13px;color:var(--sub)}.visit .p{font-weight:600;text-align:end}
.visit .m{grid-column:1/-1;font-size:14px;color:var(--sub);white-space:pre-wrap}
.visit img{grid-column:1/-1;width:120px;height:120px;object-fit:cover;border-radius:12px}
.big{background:var(--deep);color:var(--deepInk);border-radius:20px;padding:20px}
.big .v{font:600 clamp(36px,11vw,52px)/1.05 Outfit,sans-serif}
.big .l{font-size:14px;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.kpis div{border-top:1px solid color-mix(in srgb,var(--deepInk) 25%,transparent);padding-top:10px}
.kpis b{display:block;font:600 22px Outfit,sans-serif}
.bars{margin-top:8px}
.bar{display:grid;grid-template-columns:5.5em minmax(0,1fr) 5.5em;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.bar i{display:block;height:14px;border-radius:7px;background:var(--acc)}
.bar i.dim{background:var(--deep)}
.bar .num{text-align:end}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.month b{font-size:18px}
.sheet{position:fixed;inset:0;z-index:10;background:rgb(0 0 0/.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet form{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(4vw,16px) calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:20px}
label{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
input,select,textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:8px 12px}
textarea{min-height:80px;resize:vertical;line-height:1.5}
textarea.tall{min-height:calc(5 * 1.5em + 18px)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
/* iPhone の Safari では日付・時間の欄が中身の幅より小さくならず、はみ出すため */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
/* 予約を追加：お客様の一覧と日付・時間の間をあける */
#b1pick{margin-bottom:40px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;display:none;gap:12px;align-items:center}
.toast.show{display:flex}
.toast button{background:none;border:0;color:var(--acc);font:inherit;font-weight:700;min-height:36px;cursor:pointer}
.back{background:none;border:0;color:var(--acc);font:inherit;font-weight:700;min-height:44px;padding:0;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.sheet.open form{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--deep)}
.lcard{width:100%;max-width:420px;background:var(--bg);border-radius:22px;padding:24px 20px}
.lcard h1{margin:0 0 4px;font-size:24px}.lcard p.s{margin:0 0 8px;color:var(--sub);font-size:14px}
.lmsg{min-height:1.5em;color:var(--acc);font-weight:700;font-size:14px;margin:10px 0 0}
.carte.trial{background:var(--accSoft);margin-bottom:12px}.carte.trial p{margin:6px 0 12px;font-size:14px}
.trialbar{display:block;width:100%;text-align:left;background:var(--accSoft);color:var(--ink);border:0;border-radius:12px;padding:10px 12px;margin:0 0 12px;font:inherit;font-size:13px;cursor:pointer}
.plans{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}.plans li,.btn.planbtn{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--bg)}.plans li{border:0;background:var(--card)}
.plans b,.planbtn b{flex:1;text-align:left}.plans .num,.planbtn .num{font-size:20px;font-weight:600}.plans small,.planbtn small{color:var(--sub);font-size:13px}
.btn.planbtn{min-height:56px;margin-bottom:8px;border-color:var(--acc)}
.link.delink{display:block;margin:22px auto 4px;color:var(--acc)}
.pk-list{margin-top:6px}
.bklink{display:flex;gap:6px;align-items:flex-start;background:var(--accSoft);border-radius:10px;padding:8px 10px;margin:4px 0 8px!important;color:var(--ink)!important}.bklink svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--acc)}.pk-h{margin-top:14px!important;font-weight:700}
.mv{display:flex;gap:6px}.mv .btn{min-width:44px}.mv .btn:disabled{opacity:.3;cursor:default}
.msel{position:relative}.msel select{width:100%;padding-right:96px}.msel .mp{position:absolute;right:36px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:15px;pointer-events:none}
.bkb{display:flex;align-items:center;gap:4px;width:max-content;margin-top:4px;padding:2px 8px;border-radius:999px;background:var(--accSoft);color:var(--acc);font-size:12px;font-weight:700}.bkb svg{width:14px;height:14px}
.pk-row,.pk-sel{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);padding:8px 2px;font:inherit;color:inherit;cursor:pointer}
.pk-sel{border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:default}
.pk-row .nm,.pk-sel .nm{font-weight:700}.pk-row .kn,.pk-sel .kn{font-size:13px;color:var(--sub)}.pk-row .last b.soon{color:var(--acc)}.pk-row .last{text-align:right;font-size:12px;color:var(--sub)}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.bhead h2{margin-right:auto}.seg{margin:0}
.tlw{overflow-x:auto;margin:8px 0 12px;border:1px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch}
.tl{position:relative;font-size:12px}
.tlh,.tlr{display:flex;border-bottom:1px solid var(--line)}.tlr:last-child{border-bottom:0}
.tln{position:sticky;left:0;z-index:3;flex:none;width:76px;padding:8px 6px;background:var(--card);font-weight:700;font-size:13px;border-right:1px solid var(--line);overflow-wrap:anywhere}
.tlt{position:relative;flex:none}
.tlh{height:30px}.tlh .tln{padding:0}
.tlh span{position:absolute;top:7px;padding-left:4px;color:var(--sub);font-size:12px}
.tlt i{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}.tlt i.half{border-left-style:dashed;opacity:.6}
.tlt .now{position:absolute;top:0;bottom:0;border-left:2px solid var(--acc);z-index:2}
.tlb{position:absolute;height:38px;border-radius:8px;border:0;padding:2px 6px;text-align:left;font:inherit;font-size:12px;font-weight:700;line-height:1.25;color:#122326;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;z-index:1}
.tlb small{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.tlb.c0{background:#fff08a}.tlb.c1{background:#cfe3f7}.tlb.c2{background:#efb1e3}.tlb.c3{background:#bfe8b0}.tlb.c4{background:#ffd3a8}.tlb.c5{background:#d9cff5}
.tlb.done{opacity:.45}.tlb.on{outline:3px solid var(--acc);outline-offset:1px;z-index:2}
.swb{position:fixed;left:0;top:50%;z-index:50;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:var(--deep);color:#fff;display:grid;place-items:center;font-size:24px;line-height:1;opacity:0;transform:translateX(-40px);pointer-events:none;transition:opacity .15s,background .15s}
.swb.on{opacity:.85;transition:opacity .15s}.swb.go{background:var(--acc);opacity:1}
.lcard a,.hint a{color:var(--acc)}
.sec{border:1px solid var(--line);border-radius:18px;padding:6px 16px 14px;margin:0 0 16px;background:var(--bg);box-shadow:0 1px 3px rgb(0 0 0/.05)}

/* 顧客一覧の「＋ 新しいお客様」：下のタブのすぐ上の右側にいつも出す。PCでは画面の真ん中の列の右端にそろえる */

.fab-space{height:72px}
body.has-fab .toast{bottom:calc(140px + env(safe-area-inset-bottom))}

<body>
<section class="login" id="login" hidden>
  <div class="lcard">
    <div id="start" hidden>
      <h1>美容室カルテ</h1><p class="s">顧客カルテ・予約・売上をスマホひとつで。<br>登録なしで、今すぐ使えます。</p>
      <button class="btn pri wide" type="button" id="startBtn" style="margin-top:18px">はじめる</button>
      <p class="lmsg" id="smsg"></p>
      <button class="link" type="button" id="toLogin">登録済みの方はこちら（ログイン）</button>
      <p class="hint" style="margin-top:14px">「はじめる」を押すと、<a href="terms.html" target="_blank" rel="noopener">利用規約</a>と<a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>に同意したものとします。</p>
    </div>
    <form id="loginForm" autocomplete="on">
      <h1>美容室カルテ</h1><p class="s">お店コードとパスワードでログイン</p>
      <label for="lcode">お店コード</label><input id="lcode" autocapitalize="off" autocomplete="organization" required>
      <label for="lid">スタッフID <small>（オーナーは空欄でOK）</small></label><input id="lid" autocapitalize="off" autocomplete="username" placeholder="スタッフの方だけ入力">
      <label for="lpw">パスワード</label><input id="lpw" type="password" autocomplete="current-password" required>
      <button class="btn pri wide" type="submit" style="margin-top:18px">ログイン</button>
      <p class="lmsg" id="lmsg"></p>
      <button class="link" type="button" id="toStart">はじめての方はこちら（登録なしで使う）</button><br>
      <button class="link" type="button" id="toAdmin">運営者：新しいお店を作る</button><br>
      <a class="link" href="terms.html" target="_blank" rel="noopener" style="display:inline-block;line-height:44px;margin-right:16px">利用規約</a><a class="link" href="privacy.html" target="_blank" rel="noopener" style="display:inline-block;line-height:44px">プライバシーポリシー</a>
    </form>
    <form id="admin" hidden autocomplete="off">
      <h1>新しいお店を作る</h1><p class="s">運営者用。合言葉（ADMIN_KEY）が必要です</p>
      <label for="ak">合言葉（ADMIN_KEY）</label><input id="ak" name="admin_key" type="password" required>
      <label for="an">お店の名前</label><input id="an" name="salon_name" required>
      <label for="ac">お店コード（ログイン用・英小文字と数字）</label><input id="ac" name="salon_code" autocapitalize="off" required placeholder="例：nuki-salon">
      <label for="aop">オーナーのパスワード（8文字以上）</label><input id="aop" name="owner_password" type="password" minlength="8" required autocomplete="new-password">
      <p class="s" style="margin-top:10px">オーナーは「お店コード＋パスワード」だけでログインできます。名前はログイン後に「管理」から変えられます。</p>
      <button class="btn pri wide" type="submit" style="margin-top:18px">お店を作る</button>
      <p class="lmsg" id="amsg"></p>
      <button class="link" type="button" id="backLogin">‹ ログインに戻る</button>
    </form>
  </div>
</section>
<div id="app" hidden>
<header><h1 id="ttl">顧客カルテ</h1><p id="sub"></p></header>
<main id="view"></main>
<nav class="tabs" role="tablist">
  <button data-tab="cust" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>顧客カルテ</button>
  <button data-tab="book" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>予約</button>
  <button data-tab="sales" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>売上</button>
  <button data-tab="admin" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>管理</button>
</nav>
</div>
<div class="sheet" id="sheet"><form id="form" autocomplete="off"></form></div>
<div class="lb" id="lb" role="dialog" aria-label="写真"><img id="lbImg" alt="施術写真"><span class="cnt num" id="lbCnt"></span>
<div class="row"><button class="btn" type="button" data-lb="prev">‹ 前</button><button class="btn" type="button" data-lb="next">次 ›</button><button class="btn" type="button" data-lb="del">削除</button><button class="btn" type="button" data-lb="close">閉じる</button></div></div>
<div class="swb" id="swb" aria-hidden="true">‹</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="undo" type="button">元に戻す</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
{
/* ===== 設定 ===== */
const SB_URL = 'https://lnawjlzsgaeziovfxkvk.supabase.co';
const SB_KEY = 'sb_publishable_4cUAKD5aEzQe4lo1D-fAzQ_mqxvKIxa';
const BUCKET = 'salon-photos';
const MAXP = 9;
const loginEmail = (code, login) => `${login}.${code}@staff.example.com`;
const sb = window.supabase.createClient(SB_URL, SB_KEY);

/* ===== 小道具 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => '¥' + Math.round(n || 0).toLocaleString('ja-JP');
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
const WD = '日月火水木金土';
const jdate = s => { const d = new Date(s + 'T00:00'); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')' };
const hm = t => (t || '').slice(0, 5);
const nowT = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(Math.floor(d.getMinutes() / 5) * 5) };
const uuid = () => crypto.randomUUID();
let today = new Date(), T = ymd(today);
const lsGet = k => { try { return localStorage.getItem(k) } catch (e) { return null } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} };

/* ===== 状態 ===== */
const S = { salon: null, me: null, staff: [], menus: [], products: [], customers: [], visits: [], bookings: [] };
const urlCache = {};
let menuSorting = false, prodSorting = false, staffSorting = false;
let bview = lsGet('bview') === 'tl' ? 'tl' : 'list', tlSel = null;
let tab = 'cust', day = T, calM = T.slice(0, 7), detail = null, month = T.slice(0, 7), undoFn = null, tt = null, lastLoad = 0, busy = false;
let smode = 'month', syear = today.getFullYear(), sfrom = ymd(addDays(today, -29)), sto = T;

const can = p => !!S.me && (S.me.role === 'owner' || !!S.me['can_' + p]);
const cust = id => S.customers.find(c => c.id === id) || { name: '（削除された顧客）', kana: '' };
const staffName = id => S.staff.find(s => s.id === id)?.display_name || '';
const vkey = v => v.visited_on + ' ' + (v.visited_at || '00:00');
const lastVisit = id => S.visits.filter(v => v.customer_id === id).sort((a, b) => vkey(b).localeCompare(vkey(a)))[0];
const retail = v => (v.visit_items || []).reduce((s, x) => s + x.price * x.qty, 0);
const menuStr = v => (v.visit_menus || []).slice().sort((a, b) => a.sort - b.sort).map(m => m.menu_name).join('・') || '（メニューなし）';
const photos = v => (v.visit_photos || []).slice().sort((a, b) => a.sort - b.sort);

function toast(msg, undo) {
  undoFn = undo || null; $('#toastMsg').textContent = msg; $('#undo').style.display = undo ? '' : 'none';
  $('#toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('#toast').classList.remove('show'), 4000);
}
$('#undo').addEventListener('click', async () => { $('#toast').classList.remove('show'); if (undoFn) { await undoFn(); render() } });
const fail = (e, msg) => { console.error(e); toast(msg || 'うまく保存できませんでした。電波を確認してもう一度お試しください'); };
async function q(p, msg) { const { data, error } = await p; if (error) { fail(error, msg); throw error } return data }

/* ===== 写真 ===== */
function shrink(file, max, square) {
  return new Promise(res => {
    const img = new Image(), r = new FileReader();
    r.onerror = () => res(null);
    r.onload = () => {
      img.onerror = () => res(null);
      img.onload = () => {
        const c = document.createElement('canvas'), g = c.getContext('2d');
        if (square) { const m = Math.min(img.width, img.height); c.width = c.height = max; g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, max, max) }
        else { const s = Math.min(1, max / Math.max(img.width, img.height)); c.width = img.width * s; c.height = img.height * s; g.drawImage(img, 0, 0, c.width, c.height) }
        c.toBlob(b => res(b), 'image/jpeg', .8);
      }; img.src = r.result;
    }; r.readAsDataURL(file);
  });
}
async function upload(blob, path) {
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg', upsert: false });
  if (error) throw error;
  urlCache[path] = URL.createObjectURL(blob);
  return path;
}
async function signAll(paths) {
  const need = [...new Set(paths.filter(p => p && !urlCache[p]))];
  for (let i = 0; i < need.length; i += 100) {
    const { data } = await sb.storage.from(BUCKET).createSignedUrls(need.slice(i, i + 100), 60 * 60 * 6);
    (data || []).forEach(d => { if (d.signedUrl) urlCache[d.path] = d.signedUrl });
  }
}
const img = p => urlCache[p] || 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
const avatar = (c, cls = 'av') => c.face_path ? `<span class="${cls}"><img src="${img(c.face_path)}" alt=""></span>` : `<span class="${cls}">${esc((c.name || '?')[0])}</span>`;

/* ===== 読み込み ===== */
async function loadAll() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return showLogin();
  S.trial = !!user.is_anonymous && !user.email;
  const me = (await sb.from('staff').select('*').eq('user_id', user.id).eq('active', true).maybeSingle()).data;
  if (!me && S.trial) { await sb.auth.signOut(); return showLogin() }
  if (!me) { await sb.auth.signOut(); return showLogin('このアカウントは使えません。オーナーに確認してください') }
  const [salon, staff, menus, products, customers, visits, bookings] = await Promise.all([
    sb.from('salons').select('*').eq('id', me.salon_id).single(),
    sb.from('staff').select('*').order('sort').order('created_at'),
    sb.from('menus').select('*').order('sort').order('created_at'),
    sb.from('products').select('*').order('sort').order('created_at'),
    sb.from('customers').select('*'),
    sb.from('visits').select('*, visit_menus(*), visit_items(*), visit_photos(*)'),
    sb.from('bookings').select('*').neq('status', 'cancelled'),
  ]);
  const err = [salon, staff, menus, products, customers, visits, bookings].find(r => r.error);
  if (err) { fail(err.error, '読み込めませんでした。電波を確認してください'); return }
  Object.assign(S, { me, salon: salon.data, staff: staff.data, menus: menus.data, products: products.data, customers: customers.data, visits: visits.data, bookings: bookings.data });
  lastLoad = Date.now(); today = new Date(); T = ymd(today);
  $('#login').hidden = true; $('#app').hidden = false;
  if (tab === 'sales' && !can('view_sales')) tab = 'cust';
  render();
  if (!S.trial && S.salon.plan_until && !paid() && planSynced !== S.salon.id) { planSynced = S.salon.id; syncPlan().then(render).catch(() => {}) }
  signAll([...S.customers.map(c => c.face_path), ...S.visits.flatMap(v => (v.visit_photos || []).map(p => p.path))]).then(render);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.me && Date.now() - lastLoad > 60000 && !$('#sheet').classList.contains('open')) loadAll() });

/* ===== ログイン ===== */
function showLogin(msg) {
  document.body.classList.remove('has-fab');
  const first = !lsGet('salon-code') && !msg;
  $('#app').hidden = true; $('#login').hidden = false; $('#admin').hidden = true;
  $('#start').hidden = !first; $('#loginForm').hidden = first;
  $('#lcode').value = lsGet('salon-code') || '';
  $('#lmsg').textContent = msg || '';
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); if (busy) return; busy = true;
  const code = $('#lcode').value.trim().toLowerCase(), id = $('#lid').value.trim().toLowerCase() || 'owner', pw = $('#lpw').value;
  $('#lmsg').textContent = 'ログインしています…';
  const { error } = await sb.auth.signInWithPassword({ email: loginEmail(code, id), password: pw });
  busy = false;
  if (error) { $('#lmsg').textContent = 'お店コードかパスワードが違います'; return }
  lsSet('salon-code', code); $('#lpw').value = ''; tab = 'cust'; detail = null; loadAll();
});
$('#toAdmin').addEventListener('click', () => { $('#loginForm').hidden = true; $('#admin').hidden = false });
$('#toLogin').addEventListener('click', () => { $('#start').hidden = true; $('#loginForm').hidden = false });
$('#toStart').addEventListener('click', () => { $('#loginForm').hidden = true; $('#start').hidden = false });
// 登録なしで始める：匿名ログイン → 自分専用のお店を自動で作る
$('#startBtn').addEventListener('click', async () => {
  if (busy) return; busy = true; $('#startBtn').disabled = true; $('#smsg').textContent = '準備しています…';
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { const { error } = await sb.auth.signInAnonymously(); if (error) throw error }
    await staffAdmin({ action: 'start_trial' });
    $('#smsg').textContent = ''; tab = 'cust'; detail = null; busy = false; await loadAll();
  } catch (err) { $('#smsg').textContent = '始められませんでした。電波を確認して、もう一度押してください' }
  busy = false; $('#startBtn').disabled = false;
});
$('#backLogin').addEventListener('click', () => { $('#admin').hidden = true; $('#loginForm').hidden = false });
// お店の名前が英数字なら、お店コードを自動で入れる（手で直したらそれ以降は触らない）
$('#ac').addEventListener('input', () => { $('#ac').dataset.touched = '1' });
$('#an').addEventListener('input', () => {
  if ($('#ac').dataset.touched) return;
  $('#ac').value = $('#an').value.toLowerCase().replace(/[\s_]+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 30);
});
$('#admin').addEventListener('submit', async e => {
  e.preventDefault(); if (busy) return; busy = true;
  const f = Object.fromEntries(new FormData(e.target));
  $('#amsg').textContent = '作成しています…';
  try {
    const r = await fetch(SB_URL + '/functions/v1/salon-admin', {
      method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, 'x-admin-key': f.admin_key },
      body: JSON.stringify({ action: 'create_salon', salon_code: f.salon_code.trim().toLowerCase(), salon_name: f.salon_name.trim(), owner_login_id: 'owner', owner_name: 'オーナー', owner_password: f.owner_password }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $('#amsg').textContent = j.error || ('作れませんでした（' + r.status + '）'); }
    else {
      $('#lcode').value = f.salon_code.trim().toLowerCase(); $('#lid').value = ''; $('#lpw').value = '';
      e.target.reset(); delete $('#ac').dataset.touched; $('#amsg').textContent = '';
      $('#admin').hidden = true; $('#loginForm').hidden = false;
      $('#lmsg').textContent = 'お店を作りました！パスワードを入れてログインしてください'; $('#lpw').focus();
    }
  } catch (err) { $('#amsg').textContent = '通信できませんでした'; }
  busy = false;
});
async function staffAdmin(body) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(SB_URL + '/functions/v1/salon-admin', {
    method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + session.access_token },
    body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'エラー（' + r.status + '）');
  return j;
}

/* ===== 画面 ===== */
const TRIAL_MONTHS = 6;
const trialEnd = () => { const d = new Date(S.salon.created_at); d.setMonth(d.getMonth() + TRIAL_MONTHS); return d };
const trialLeft = () => Math.ceil((trialEnd() - Date.now()) / 864e5);
const mdj = d => (d.getMonth() + 1) + '月' + d.getDate() + '日';
function render() {
  if (!S.me) return;
  const expired = trialLeft() <= 0 && !paid();
  $('nav.tabs').hidden = expired;
  if (expired && S.trial) {
    $('#ttl').textContent = 'お店の登録'; $('#sub').textContent = S.salon.name;
    $('#view').innerHTML = `<div class="carte trial"><h2 style="margin-top:0">いつもご利用ありがとうございます</h2>
      <p>無料でお使いいただける期間（${TRIAL_MONTHS}か月）が終わりました。<b>お店を登録して有料プランにお申し込みいただく</b>と、これまでのお客様・来店記録・写真はそのまま使い続けられます。</p>
      <button class="btn pri wide" id="regBtn">お店を登録する</button></div>`;
    return;
  }
  if (expired) {
    // 登録済みで、6か月たって有料プランでない：有料プランの案内だけ（ログアウト・アカウントの消去はできるように）
    document.body.classList.remove('has-fab');
    $('#ttl').textContent = '有料プラン'; $('#sub').textContent = S.salon.name + '・' + S.me.display_name;
    $('#view').innerHTML = `<div class="carte trial"><h2 style="margin-top:0">いつもご利用ありがとうございます</h2>
      <p>無料でお使いいただける期間（${TRIAL_MONTHS}か月）が終わりました。${S.me.role === 'owner' ? '<b>有料プランにお申し込みいただく</b>と、' : '<b>オーナーが有料プランにお申し込みする</b>と、'}これまでのお客様・来店記録・写真はそのまま使い続けられます。</p>
      <button class="btn pri wide" id="planBtn">有料プランを見る</button></div>
      <div class="row"><button class="btn sm" id="relogin">別のお店・アカウントでログイン</button><button class="btn sm danger" id="logout">ログアウト</button></div>
      <p style="text-align:center;margin:18px 0 0"><a class="link" href="terms.html" target="_blank" rel="noopener" style="margin-right:16px">利用規約</a><a class="link" href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a></p>
      <button class="link danger delink" id="delAcc">${S.me.role === 'owner' ? 'お店とアカウントを消去する' : '自分のアカウントを消去する'}</button>`;
    return;
  }
  document.querySelectorAll('nav.tabs button').forEach(b => { b.setAttribute('aria-selected', b.dataset.tab === tab); if (b.dataset.tab === 'sales') b.hidden = !can('view_sales') });
  $('nav.tabs').style.gridTemplateColumns = `repeat(${can('view_sales') ? 4 : 3},minmax(0,1fr))`;
  const v = $('#view');
  if (tab === 'book') { $('#ttl').textContent = day === T ? '今日の予約' : jdate(day) + 'の予約'; v.innerHTML = bookView() }

/* タイムライン：横が時間（30分ごと）、縦がスタッフ。重なる予約は同じスタッフの中で段を分ける */

  const x = m => (m - s0) / SLOT * W, width = x(e0);

  if (list.some(b => !b.stylist_id)) ids.push('');
  let head = ''; for (let m = s0; m < e0; m += SLOT) head += `<span class="num" style="left:${x(m)}px;width:${W}px">${Math.floor(m / 60)}:${pad(m % 60)}</span>`;
  let grid = ''; for (let m = s0; m <= e0; m += SLOT) grid += `<i style="left:${x(m)}px" class="${m % 60 ? 'half' : ''}"></i>`;
  const now = day === T ? (() => { const d = new Date(), m = d.getHours() * 60 + d.getMinutes(); return m >= s0 && m <= e0 ? `<b class="now" style="left:${x(m)}px"></b>` : '' })() : '';
  const rows = ids.map(id => {
    const bs = list.filter(b => (b.stylist_id || '') === id).sort((a, b) => a.start_time.localeCompare(b.start_time)), ends = [];
    const blocks = bs.map(b => {
      const st = toMin(b.start_time), en = st + (+b.duration_min || 60); let ln = ends.findIndex(e => e <= st); if (ln < 0) ln = ends.length; ends[ln] = en;
      const c = cust(b.customer_id), col = [...b.customer_id].reduce((h, ch) => h + ch.charCodeAt(0), 0) % TL_COLORS;
      return `<button class="tlb c${col} ${b.status === 'done' ? 'done' : ''} ${b.id === tlSel ? 'on' : ''}" data-tlsel="${b.id}" style="left:${x(st) + 1}px;width:${Math.max(x(en) - x(st) - 2, 24)}px;top:${ln * LANE + 4}px" aria-label="${esc(c.name)}様 ${hm(b.start_time)}から ${esc((b.menu_names || []).join('・'))}">${esc(c.name)}様 <small>${esc((b.menu_names || []).join('・'))}</small></button>`;
    }).join('');
    const h = Math.max(1, ends.length) * LANE + 8;
    return `<div class="tlr" style="height:${h}px"><div class="tln">${esc(id ? staffName(id) : '担当なし')}</div><div class="tlt" style="width:${width}px">${grid}${blocks}${now}</div></div>`;
  }).join('');

}

/* ===== シート（入力画面） ===== */
function open(html, onSave, saveLabel = '保存') {
  const f = $('#form');
  f.innerHTML = html + `<div class="row" style="margin-top:18px"><button class="btn" type="button" id="cancel">キャンセル</button><button class="btn pri" type="submit" style="flex:1">${saveLabel}</button></div>`;
  f.onsubmit = async e => {
    e.preventDefault(); if (busy) return; busy = true; const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = '保存中…';
    try { const r = await onSave(new FormData(f)); if (r !== false) { close(); render() } }
    catch (err) { if (!err?.shown) fail(err, err?.message) }
    finally { busy = false; btn.disabled = false; btn.textContent = saveLabel }
  };
  $('#cancel').onclick = close; $('#sheet').classList.add('open'); f.scrollTop = 0;
}
function close() { $('#sheet').classList.remove('open') }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') close() });
$('#form').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && !e.isComposing) e.preventDefault() });
const userErr = m => { const e = new Error(m); toast(m); e.shown = true; return e };

// 誕生日は「年・月・日」の3つの選択（iPhone では下からホイールが出て「完了」で閉じられる。カレンダーの小窓は閉じにくいため）
function bdaySel(v) {
  const [y, m, d] = (v || '').split('-').map(Number), ty = new Date().getFullYear();
  const opt = (val, label, sel) => `<option value="${val}" ${sel ? 'selected' : ''}>${label}</option>`;
  const ys = [opt('', '年', !y)]; for (let i = ty; i >= 1920; i--) ys.push(opt(i, i + '年', i === y));
  const ms = [opt('', '月', !m)]; for (let i = 1; i <= 12; i++) ms.push(opt(i, i + '月', i === m));
  const ds = [opt('', '日', !d)]; for (let i = 1; i <= 31; i++) ds.push(opt(i, i + '日', i === d));
  return `<div class="bday"><select id="f7" name="by" aria-label="誕生日の年">${ys.join('')}</select><select name="bm" aria-label="誕生日の月">${ms.join('')}</select><select name="bd" aria-label="誕生日の日">${ds.join('')}</select></div>`;
}
// 3つとも選ばれていれば「YYYY-MM-DD」、1つも選ばれていなければ未登録。途中まで・ない日付は知らせる
function bdayOf(fd) {
  const y = +fd.get('by'), m = +fd.get('bm'), d = +fd.get('bd');
  if (!y && !m && !d) return null;
  if (!y || !m || !d) throw userErr('誕生日は「年・月・日」をすべて選んでください（わからなければすべて空に）');
  const dt = new Date(y, m - 1, d);
  if (dt.getMonth() !== m - 1) throw userErr(m + '月' + d + '日はありません');
  if (dt > new Date()) throw userErr('誕生日が今日より先になっています');
  return y + '-' + pad(m) + '-' + pad(d);
}

// メニューは名前ではなく「登録したメニューそのもの（id）」で選ぶ（例：カット4500円とカット4000円を分けるため）

const menuOpts = sel => { const act = S.menus.filter(m => m.active); let h = act.map(m => `<option value="${m.id}" ${m.id === sel ? 'selected' : ''}>${menuLabel(m)}</option>`).join(''); if (sel && !act.some(m => m.id === sel)) h += `<option value="${esc(sel)}" selected>${esc(menuOf(sel).name)}</option>`; return h };

const digits = t => String(t || '').replace(/\D/g, '');
// これからの予約（今日以降・来店済みでないもの）。編集中の予約は除く
const nextBooking = (cid, except) => S.bookings.filter(x => x.customer_id === cid && x.id !== except && x.status !== 'done' && x.booked_on >= T).sort((a, b) => (a.booked_on + a.start_time).localeCompare(b.booked_on + b.start_time))[0];
const CAL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
const bookBadge = nb => nb ? `<span class="bkb">${CAL_ICON}予約あり ${jdate(nb.booked_on)} <span class="num">${hm(nb.start_time)}</span></span>` : '';
// 来店周期から「そろそろ来店しそうなお客様」を予想する
//  周期＝そのお客様の来店の間隔の真ん中の値（1回しか来ていない人はお店全体の真ん中の値。7日未満の間隔は数えない）
//  目安の日＝前回の来店日＋周期。目安の日の前後14日以内で、予約がない人を、目安の日に近い順に6人（今日より先の日付の来店は数えない）
const dayNo = d => Math.round(new Date(d + 'T00:00') / 864e5);
const median = a => { const x = a.slice().sort((p, q) => p - q); return x.length ? x[Math.floor(x.length / 2)] : null };
function duePredictions(except) {
  const tN = dayNo(T), all = [];
  const per = S.customers.map(c => {
    const ds = [...new Set(S.visits.filter(v => v.customer_id === c.id && v.visited_on <= T).map(v => v.visited_on))].sort();
    const gaps = ds.slice(1).map((d, i) => dayNo(d) - dayNo(ds[i])).filter(g => g >= 7); all.push(...gaps);
    return { c, ds, gaps };
  });
  const shop = median(all) || 45;
  return per.filter(p => p.ds.length && !nextBooking(p.c.id, except)).map(p => {
    const cyc = p.gaps.length ? median(p.gaps) : shop;
    return { c: p.c, cyc, guess: !p.gaps.length, diff: dayNo(p.ds[p.ds.length - 1]) + cyc - tN };
  }).filter(x => Math.abs(x.diff) <= 14).sort((a, b) => Math.abs(a.diff) - Math.abs(b.diff) || a.diff - b.diff).slice(0, 6);
}
function custPicker(id, except) {
  const box = $('#' + id + 'pick'), hidden = $('#' + id);
  const row = (c, pr) => { const l = lastVisit(c.id); return `<button type="button" class="pk-row" data-pick="${c.id}">${avatar(c)}<span><span class="nm">${esc(c.name)}</span><br><span class="kn">${esc(c.kana)}${c.tel ? '・' + esc(c.tel) : ''}</span>${bookBadge(nextBooking(c.id, except))}</span><span class="last">${pr ? `<b class="${pr.diff <= 0 ? 'soon' : ''}">${pr.diff > 0 ? 'あと' + pr.diff + '日' : pr.diff === 0 ? '今日が目安' : pr.diff * -1 + '日すぎ'}</b><br>${pr.guess ? 'お店の平均' : '約'}${pr.cyc}日ごと` : l ? '前回 ' + jdate(l.visited_on) : '来店なし'}</span></button>` };
  const results = q => {
    q = q.trim();
    if (!q) {
      const pred = duePredictions(except);
      // 当てはまる人がいなければ何も出さない
      return pred.length ? '<p class="hint pk-h">来店周期から、そろそろ来店しそうなお客様</p>' + pred.map(x => row(x.c, x)).join('') : '';
    }
    const hq = hira(q).replace(/\s/g, ''), dq = digits(q);
    const hit = S.customers.filter(c => hira(c.name + c.kana).replace(/\s/g, '').includes(hq) || (dq.length >= 3 && digits(c.tel).includes(dq)))
      .sort((a, b) => a.kana.localeCompare(b.kana, 'ja'));
    if (!hit.length) return '<p class="hint">見つかりませんでした</p>';
    return hit.slice(0, 8).map(c => row(c)).join('') + (hit.length > 8 ? `<p class="hint">ほかに${hit.length - 8}人います。もう少し入力して絞り込んでください</p>` : '');
  };
  const draw = () => {
    const c = hidden.value && S.customers.find(x => x.id === hidden.value);
    if (c) { box.innerHTML = `<div class="pk-sel">${avatar(c)}<span><span class="nm">${esc(c.name)} 様</span><br><span class="kn">${esc(c.kana)}</span>${bookBadge(nextBooking(c.id, except))}</span><button type="button" class="btn sm" data-repick="1">変更</button></div>`; return }
    box.innerHTML = `<input id="${id}q" type="search" autocomplete="off" placeholder="名前・ふりがな・電話で検索"><div class="pk-list" id="${id}res">${results('')}</div>`;
    const qi = $('#' + id + 'q'); qi.oninput = () => { $('#' + id + 'res').innerHTML = results(qi.value) };
  };
  box.onclick = e => { const p = e.target.closest('[data-pick]'); if (p) { hidden.value = p.dataset.pick; draw() } else if (e.target.closest('[data-repick]')) { hidden.value = ''; draw(); $('#' + id + 'q').focus() } };
  draw();
}

const prow = (pid, q0) => `<div class="prw"><select name="pid" aria-label="店販商品">${pid ? '' : '<option value="" selected disabled>商品を選ぶ</option>'}${S.products.filter(p => p.active || p.id === pid).map(p => `<option value="${p.id}" ${p.id === pid ? 'selected' : ''}>${esc(p.name)}（${yen(p.price)}・在庫${p.stock}）</option>`).join('')}</select><input name="pq" type="number" inputmode="numeric" min="1" value="${q0 || 1}" aria-label="数"><button type="button" class="mx px" aria-label="この商品を外す">×</button></div>`;
const mrow = (opts, sel) => `<div class="mrow"><select name="m" aria-label="メニュー">${opts.map((m, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(m.name)}（${yen(m.price)}）</option>`).join('')}</select><button type="button" class="mx" aria-label="このメニューを外す">×</button></div>`;
// その日のまだ来店していない予約（いちばん早い時間のもの）
const openBooking = (cid, date) => S.bookings.filter(x => x.customer_id === cid && x.booked_on === date && x.status !== 'done').sort((a, c) => a.start_time.localeCompare(c.start_time))[0];
function visitForm(cid, b, ev) {
  // カルテから記録するときも、今日の予約があればつなげる（メニュー・金額・担当を入れておき、保存で予約を来店済みにする）
  // 「今日」は開いたときの日付で決める（アプリを開いたまま日付が変わっても、その日の予約を見つけられるように）
  const td = ymd(new Date());
  const auto = !ev && !b; if (auto) b = openBooking(cid, td);
  // 選択肢はメニューそのもの。同じ名前でも金額がちがえば別の行

    if (i < 0 && price != null) i = opts.findIndex(o => o.name === name && o.price === price);
    if (i < 0) i = opts.findIndex(o => o.name === name);

  const startIdx = ev ? (ev.visit_menus || []).slice().sort((a, c) => a.sort - c.sort).map(l => pick(l.menu_name, +l.list_price))
    : b ? (b.menu_names || []).map((n, i) => pick(n, null, (b.menu_ids || [])[i])) : [];
  if (!opts.length) opts.push({ id: '', name: 'カット', price: 0, dur: 60 });
  if (!startIdx.length) startIdx.push(0);
  let keep = ev ? photos(ev).slice() : [];
  const myStylist = ev ? ev.stylist_id : b ? b.stylist_id : (S.me.is_stylist ? S.me.id : '');
  open(`<h3>${ev ? '来店履歴を編集' : '施術を記録'}</h3>${!ev && b ? `<p class="hint bklink">${CAL_ICON}${jdate(b.booked_on)} ${hm(b.start_time)} の予約とつなげて記録します。保存すると、予約は「来店済み」になります。</p>` : ''}

  <div><label for="v1t">時間</label><input id="v1t" name="time" type="time" step="300" value="${ev ? hm(ev.visited_at) : b ? hm(b.start_time) : nowT()}"></div></div>
  <div class="two"><div><label for="vst">担当スタイリスト</label>${stylistSel('vst', myStylist)}</div><div><label>&nbsp;</label><label class="chk"><input type="checkbox" name="nominated" value="1" ${(ev ? ev.nominated : b?.nominated) ? 'checked' : ''}> 指名あり</label></div></div>
  <label>メニュー</label><div id="mrows">${startIdx.map(i => mrow(opts, i)).join('')}</div>
  <button class="btn sm" type="button" id="addMr" style="margin-top:8px">＋ メニューを追加</button>
  <label for="v3">金額（円）</label><input id="v3" name="price" type="number" inputmode="numeric" min="0" step="10" value="${ev ? ev.price : b ? b.price : opts[0].price}">
  <p class="hint" id="vsum"></p>
  ${S.products.length ? `<label>店販</label><div id="prows">${(ev ? ev.visit_items || [] : b?.items || []).filter(x => !x.product_id || S.products.some(p => p.id === x.product_id)).map(x => prow(x.product_id, x.qty)).join('')}</div>
  <button class="btn sm" type="button" id="addPr" style="margin-top:8px">＋ 店販を追加</button><p class="hint" id="psum"></p>` : ''}
  <label for="v4">使った薬剤</label><textarea id="v4" name="chem" rows="5" class="tall" placeholder="例：&#10;根元 6Lv ナチュラル＋6% 1:1&#10;毛先 8Lv アッシュ＋3% 1:1.5&#10;放置 20分">${esc(ev?.chem)}</textarea>
  <label for="v5">メモ</label><textarea id="v5" name="memo" rows="5" class="tall" placeholder="次回の希望など">${esc(ev?.memo)}</textarea>
  <label for="v6">写真（最大${MAXP}枚・まとめて選べます）</label>${ev ? '<div class="pv ed" id="pk"></div>' : ''}<input id="v6" name="photo" type="file" accept="image/*" multiple>
  <p class="hint">ビフォー・アフター・前後左右など。1枚ずつ小さく圧縮して保存します</p><div class="pv" id="pv"></div><p class="hint warnt" id="pvw"></p>`, async fd => {
    const sel = fd.getAll('m').filter(i => i !== '').map(i => opts[+i]).filter(Boolean);

    const items = {}; document.querySelectorAll('#prows .prw').forEach(rw => { const id = rw.querySelector('select').value, n = +rw.querySelector('input').value || 0; if (id && n > 0) items[id] = (items[id] || 0) + n });

    // 店販（入れ替え：在庫はデータベースが自動で戻して・減らす）

    const irows = Object.entries(items).map(([pid, n]) => { const p = S.products.find(x => x.id === pid); return { salon_id: S.salon.id, visit_id: vid, product_id: pid, name: p.name, price: p.price, qty: n } });
    row.visit_items = irows.length ? await q(sb.from('visit_items').insert(irows).select()) : [];
    // 写真
    const removed = ev ? photos(ev).filter(p => !keep.includes(p)) : [];
    if (removed.length) { await q(sb.from('visit_photos').delete().in('id', removed.map(p => p.id))); sb.storage.from(BUCKET).remove(removed.map(p => p.path)) }
    const files = fd.getAll('photo').filter(f => f && f.size).slice(0, Math.max(0, MAXP - keep.length));
    const added = [];
    for (const [i, f] of files.entries()) { const bl = await shrink(f, 1280); if (!bl) continue; const path = await upload(bl, `${S.salon.id}/visits/${vid}/${uuid()}.jpg`); added.push({ salon_id: S.salon.id, visit_id: vid, path, sort: keep.length + i }) }
    row.visit_photos = keep.concat(added.length ? await q(sb.from('visit_photos').insert(added).select()) : []);
    // 在庫の最新値
    const pids = [...new Set([...Object.keys(items), ...(ev?.visit_items || []).map(x => x.product_id).filter(Boolean)])];
    if (pids.length) { const ps = await q(sb.from('products').select('id, stock').in('id', pids)); ps.forEach(p => { const x = S.products.find(y => y.id === p.id); if (x) x.stock = p.stock }) }
    if (ev) Object.assign(ev, row); else S.visits.push(row);
    // 日付を変えて保存したときは、その日の予約につなげ直す
    const link = ev ? null : !auto ? b : (b && b.booked_on === o.visited_on ? b : openBooking(cid, o.visited_on));
    if (link) { const br = await q(sb.from('bookings').update({ status: 'done', visit_id: vid }).eq('id', link.id).select().single()); Object.assign(link, br) }
    // 予約なしで来店した人も、記録した日時・メニュー・担当で予約の画面に残す（あとから振り返れるように）
    const walk = { booked_on: o.visited_on, start_time: o.visited_at || nowT(), menu_names: sel.map(m => m.name), menu_ids: sel.map(m => m.id || ''), price: o.price,
      duration_min: sel.reduce((t, m) => t + (m.dur || 60), 0) || 60, stylist_id: o.stylist_id, nominated: o.nominated,
      items: (row.visit_items || []).map(x => ({ product_id: x.product_id, name: x.name, price: x.price, qty: x.qty })) };
    const mine = ev ? S.bookings.find(x => x.visit_id === vid && x.walk_in) : null;
    if (mine) Object.assign(mine, await q(sb.from('bookings').update(walk).eq('id', mine.id).select().single()));
    else if (!ev && !link) S.bookings.push(await q(sb.from('bookings').insert({ salon_id: S.salon.id, customer_id: cid, created_by: S.me.id, status: 'done', visit_id: vid, walk_in: true, ...walk }).select().single()));
    toast(ev ? '来店履歴を更新しました' : 'カルテに記録しました' + (added.length ? '（写真' + added.length + '枚）' : ''));
  });
  let touched = !!ev;
  const sum = () => [...document.querySelectorAll('#mrows select')].reduce((s, i) => s + (i.value === '' ? 0 : opts[+i.value]?.price || 0), 0);
  const fixX = () => { const xs = document.querySelectorAll('#mrows .mx'); xs.forEach(x => x.hidden = xs.length < 2) }; fixX();
  const upd = () => { const t = sum(); if (!touched) $('#v3').value = t; const p = +$('#v3').value || 0; $('#vsum').textContent = 'メニュー合計 ' + yen(t) + (p !== t ? '（' + (p < t ? '値引き ' + yen(t - p) : '加算 ' + yen(p - t)) + '）' : '') };
  if ($('#prows')) {
    const ps = () => { let t = 0; document.querySelectorAll('#prows .prw').forEach(rw => { const pr = S.products.find(p => p.id === rw.querySelector('select').value); if (pr) t += pr.price * (+rw.querySelector('input').value || 0) }); $('#psum').textContent = t ? '店販合計 ' + yen(t) + '（施術の金額とは別に集計）' : '' };
    $('#prows').addEventListener('input', ps); $('#prows').addEventListener('change', ps);
    $('#prows').addEventListener('click', e => { if (e.target.classList.contains('px')) { e.target.parentElement.remove(); ps() } });
    $('#addPr').addEventListener('click', () => $('#prows').insertAdjacentHTML('beforeend', prow('', 1))); ps();
  }
  $('#mrows').addEventListener('change', () => { touched = false; upd() });
  $('#mrows').addEventListener('click', e => { if (e.target.classList.contains('mx')) { e.target.parentElement.remove(); fixX(); touched = false; upd() } });
  $('#addMr').addEventListener('click', () => { $('#mrows').insertAdjacentHTML('beforeend', mrow(opts, -1)); const ss = document.querySelectorAll('#mrows select'); ss[ss.length - 1].selectedIndex = -1; fixX(); upd() });
  $('#v3').addEventListener('input', () => { touched = true; upd() });
  upd();
  const room = () => Math.max(0, MAXP - keep.length);
  // 選びすぎたときの説明（1回の来店につき MAXP 枚まで）
  const photoMsg = (n, had) => {

    return (had ? `すでに${had}枚あるので、追加できるのはあと${r}枚です。` : `1回の来店で保存できるのは${MAXP}枚までです。`) + `選んだ${n}枚のうち、最初の${r}枚だけ保存します（${n - r}枚は保存されません）`;
  };
  const drawK = () => { if (!ev) return; $('#pk').innerHTML = keep.map((p, i) => `<div class="pk"><img src="${img(p.path)}" alt=""><button type="button" data-k="${i}" aria-label="この写真を外す">×</button></div>`).join(''); $('#v6').hidden = room() <= 0; $('#pvw').textContent = room() <= 0 ? '写真は上限の' + MAXP + '枚です' : '' };
  if (ev) addDelete('この来店履歴を削除する', () => delVisit(ev.id));
  if (ev) { drawK(); $('#pk').addEventListener('click', e => { const k = e.target.dataset.k; if (k !== undefined) { keep.splice(+k, 1); drawK(); $('#v6').dispatchEvent(new Event('change')) } }) }
  $('#v6').addEventListener('change', e => { const fs = [...e.target.files]; $('#pv').innerHTML = fs.slice(0, room()).map(f => `<img src="${URL.createObjectURL(f)}" alt="">`).join(''); $('#pvw').textContent = photoMsg(fs.length, keep.length) });
}

const PERMS = [['can_view_sales', '売上を見る'], ['can_edit_master', 'メニュー・店販を編集'], ['can_delete_customers', '顧客を削除'], ['can_manage_staff', 'スタッフを管理']];

    body = `${PLAN_FEATURES}<ul class="plans"><li><b>月額プラン</b><span class="num">500円</span><small>／月（税込）</small></li><li><b>年額プラン</b><span class="num">5,000円</span><small>／年（税込）</small></li></ul>
    ${PAY.webLink ? `<a class="btn pri wide" style="display:flex;align-items:center;justify-content:center;text-decoration:none" id="plWeb" href="${esc(PAY.webLink + S.salon.id)}" target="_blank" rel="noopener">申し込む（クレジットカード）</a>
    <p class="hint">別のタブでお申し込みのページが開きます。お支払いが終わったら、この画面に戻って「お支払いを確認する」を押してください。いつでも解約でき、解約しても期間の終わりまで使えます。</p>
    <button class="btn wide" type="button" id="plCheck" style="margin-top:10px">お支払いを確認する</button>` : '<p class="hint">お申し込みの準備中です。もうしばらくお待ちください。</p>'}${legal}`;
  }
  open(`<h3>有料プラン</h3>${why ? `<p class="hint">${esc(why)}</p>` : ''}${body}`, async () => { close(); return false }, '閉じる');
  $('#cancel').remove(); $('#form [type=submit]').classList.remove('pri');
  const done = async () => { await loadAll(); close(); toast('有料プランのお申し込みが確認できました。ありがとうございます') };
  if ($('#plReg')) $('#plReg').onclick = () => { close(); regForm() };
  if ($('#plCheck')) $('#plCheck').onclick = async () => {
    const b = $('#plCheck'); if (b.disabled) return; b.disabled = true; b.textContent = '確認しています…';
    try { await syncPlan(); if (paid()) return await done(); toast('まだお支払いが確認できません。少し待ってからもう一度押してください') }
    catch (e) { toast(e.message || '確認できませんでした') }
    b.disabled = false; b.textContent = 'お支払いを確認する';
  };
  if ($('#plPkgs')) {
    const box = $('#plPkgs');
    const loadPkgs = async () => {
    box.innerHTML = '<p class="hint">読み込んでいます…</p>';
    try {
      const P = await withTimeout(rc(), PAY.timeoutMs);
      if (!P) { box.innerHTML = '<p class="hint">お申し込みの準備中です。もうしばらくお待ちください。</p>'; return }
      const pkgs = (await withTimeout(P.getOfferings(), PAY.timeoutMs))?.current?.availablePackages || [];
      if (!pkgs.length) throw new Error('no packages');
      const label = k => ({ MONTHLY: ['月額プラン', '月'], ANNUAL: ['年額プラン', '年'] })[k.packageType] || [k.product.title, ''];
      box.innerHTML = pkgs.map((k, i) => { const [n, per] = label(k); return `<button class="btn wide planbtn" type="button" data-pk="${i}"><b>${esc(n)}</b><span class="num">${esc(k.product.priceString)}</span>${per ? `<small>／${per}</small>` : ''}</button>` }).join('');
      box.querySelectorAll('[data-pk]').forEach(b => b.onclick = async () => {
        if (busy) return; busy = true; box.querySelectorAll('button').forEach(x => x.disabled = true);
        try {
          try { await P.purchasePackage({ aPackage: pkgs[+b.dataset.pk] }) }
          catch (e) { if (!(e?.userCancelled || String(e?.code) === '1')) toast('お申し込みできませんでした。もう一度お試しください'); return }
          // 払ったあと：サーバーに確かめてもらい、お店の記録を更新する
          try { await syncPlan() } catch (e) { /* 下でお知らせ */ }
          if (paid()) await done();
          else toast('お申し込みを受け付けました。反映まで少し時間がかかることがあります。少し待ってから「最新に更新」を押してください');
        } finally { busy = false; box.querySelectorAll('button').forEach(x => x.disabled = false) }
      });
    } catch (e) {
      // 原因を調べられるように、返ってきた理由を小さく出す（時間切れ・商品なし・設定のまちがいなど）
      const why = e?.message === 'timeout' ? 'Apple から返事がありません（時間切れ）' : e?.message === 'no packages' ? '商品が見つかりません' : [e?.code, e?.message].filter(Boolean).join(' ').slice(0, 160);
      box.innerHTML = `<p class="hint">プランを読み込めませんでした。電波を確認して、もう一度お試しください。</p>${why ? `<p class="hint" style="font-size:11px;opacity:.8">理由：${esc(why)}</p>` : ''}<button class="btn wide" type="button" id="plRetry" style="margin:6px 0 8px">もう一度読み込む</button>`;
      $('#plRetry').onclick = loadPkgs;
    }
    };
    loadPkgs();
  }
  if ($('#plRestore')) $('#plRestore').onclick = async () => {
    if (busy) return; busy = true;
    try { const P = await withTimeout(rc(), PAY.timeoutMs); if (!P) throw 0; await withTimeout(P.restorePurchases(), PAY.timeoutMs * 2); await syncPlan(); if (paid()) await done(); else toast('復元できるお申し込みが見つかりませんでした') }
    catch (e) { toast('復元できませんでした。もう一度お試しください') }
    finally { busy = false }
  };
}
function regForm(why) {
  const auto = /[a-z0-9]/i.test(S.salon.name) ? S.salon.name.toLowerCase().replace(/[\s_]+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 30) : '';
  open(`<h3>お店を登録する</h3>${why ? `<p class="hint">${esc(why)}</p>` : ''}
  <p class="hint">これまでのデータはそのまま使えます。次からは「お店コード」と「パスワード」でログインします。</p>
  <label for="r1">お店の名前</label><input id="r1" name="name" required value="${esc(S.salon.name === 'マイサロン' ? '' : S.salon.name)}" placeholder="例：STAYGOLD">
  <label for="r2">お店コード（ログイン用・英小文字と数字）</label><input id="r2" name="code" required autocapitalize="off" pattern="[a-z0-9\\-]{3,30}" value="${esc(auto)}" placeholder="例：staygold">
  <label for="r3">パスワード（8文字以上）</label><input id="r3" name="pw" type="password" minlength="8" required autocomplete="new-password">`, async fd => {
    const code = fd.get('code').trim().toLowerCase();
    const r = await staffAdmin({ action: 'register', salon_name: fd.get('name').trim(), salon_code: code, password: fd.get('pw') }).catch(e => { throw userErr(e.message) });
    await sb.auth.refreshSession(); lsSet('salon-code', r.salon_code); await loadAll();
    toast(`登録しました！次からは お店コード「${r.salon_code}」とパスワードでログインできます`);
  }, '登録する');
  const n = $('#r1'), c = $('#r2'); n.oninput = () => { if (c.dataset.touched) return; c.value = n.value.toLowerCase().replace(/[\s_]+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 30) }; c.oninput = () => { c.dataset.touched = '1' };
}
function delVisit(id) { confirmBox('この来店履歴を削除しますか？写真も消えます。', async () => { const v = S.visits.find(x => x.id === id); const lb = S.bookings.filter(x => x.visit_id === v.id); for (const x of lb) await q(x.walk_in ? sb.from('bookings').delete().eq('id', x.id) : sb.from('bookings').update({ status: 'booked', visit_id: null }).eq('id', x.id)); await q(sb.from('visits').delete().eq('id', v.id)); const ps = photos(v).map(p => p.path); if (ps.length) sb.storage.from(BUCKET).remove(ps); S.visits = S.visits.filter(x => x !== v); await loadAll(); toast('来店履歴を削除しました') }) }
function delCust() { const c = cust(detail); confirmBox(`${c.name} 様のカルテと来店履歴・写真をすべて削除しますか？元に戻せません。`, async () => { const paths = [c.face_path, ...S.visits.filter(v => v.customer_id === c.id).flatMap(v => photos(v).map(p => p.path))].filter(Boolean); await q(sb.from('customers').delete().eq('id', c.id)); if (paths.length) sb.storage.from(BUCKET).remove(paths); detail = null; await loadAll(); toast('削除しました') }) }
// 入力シートの一番下に、目立たない削除ボタンを足す
function addDelete(label, fn) { $('#form').insertAdjacentHTML('beforeend', `<button type="button" class="link danger delink" id="delIn">${label}</button>`); $('#delIn').onclick = fn }
function confirmBox(msg, ok) { open(`<h3>確認</h3><p>${esc(msg)}</p>`, async () => { await ok(); }, '削除する'); const b = $('#form [type=submit]'); b.classList.add('dangerbtn') }

/* ===== 戻る（左端から右へスワイプ・ブラウザの戻る） ===== */
// 写真の拡大 → 入力シート → カルテ詳細 の順に、いちばん上にあるものを閉じる
function goBack() {
  if ($('#lb').classList.contains('open')) { $('#lb').classList.remove('open'); return true }
  if ($('#sheet').classList.contains('open')) { close(); return true }
  if (S.me && detail) { detail = null; render(); scrollTo(0, 0); return true }
  return false;
}
// ブラウザの「戻る」（Safariのスワイプ・Androidの戻るボタン）でアプリから出てしまわないよう、
// 1つ分の履歴を常に積んでおき、戻られたら画面の中で1つ戻ってから積み直す
try { history.replaceState({ root: 1 }, ''); history.pushState({ guard: 1 }, '') } catch (e) {}
addEventListener('popstate', () => { goBack(); try { history.pushState({ guard: 1 }, '') } catch (e) {} });
// ホーム画面から開いたiPhoneなど、ブラウザのスワイプがないときは自分でスワイプを受け取る
if (navigator.standalone === true || window.__swipe || window.Capacitor?.getPlatform?.() === 'ios') {
  let sx = null, sy = 0, dx = 0; const sw = $('#swb');
  addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX <= 24 && e.touches.length === 1 ? t.clientX : null; sy = t.clientY; dx = 0 }, { passive: true });
  addEventListener('touchmove', e => {
    if (sx === null) return; const t = e.touches[0]; dx = t.clientX - sx;
    if (Math.abs(t.clientY - sy) > 60 && dx < 30) { sx = null; sw.classList.remove('on'); return }
    sw.classList.add('on'); sw.style.transform = `translateX(${Math.min(Math.max(dx, 0), 90) - 40}px)`; sw.classList.toggle('go', dx > 70);
  }, { passive: true });
  addEventListener('touchend', () => { if (sx !== null && dx > 70) goBack(); sx = null; sw.classList.remove('on', 'go'); sw.style.transform = '' });
}

// アプリ（iPhone・Android）では「別の画面で開く」リンクを、アプリの中でそのまま開く
if (window.Capacitor?.isNativePlatform?.()) document.addEventListener('click', e => { const a = e.target.closest('a[target="_blank"]'); if (a) { e.preventDefault(); location.href = a.getAttribute('href') } });

/* ===== 起動 ===== */
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') showLogin() });
sb.auth.getSession().then(({ data }) => data.session ? loadAll() : showLogin());
}

</script>
